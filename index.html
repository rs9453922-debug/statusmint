<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">

<title>StatusMint</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b1020;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  max-width:500px;
  margin:auto;
  min-height:100vh;
  padding:20px;
}

.logo{
  font-size:30px;
  font-weight:800;
  color:#815cff;
}

.tagline{
  margin-top:5px;
  color:#adb5ca;
}

.hero{
  margin-top:28px;
  padding:25px;
  border-radius:22px;
  background:linear-gradient(135deg,#7548ed,#db3f91);
}

.hero h1{
  margin:0 0 10px;
  font-size:28px;
}

.hero p{
  margin:0;
  line-height:1.5;
}

h2{
  margin-top:30px;
}

.categories{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.category{
  border:1px solid #29324f;
  background:#171d31;
  color:#fff;
  padding:18px 8px;
  border-radius:16px;
  font-size:16px;
  cursor:pointer;
}

.category.active{
  background:#7654ff;
  border-color:#947dff;
}

.result{
  display:none;
  margin-top:28px;
}

.result.show{
  display:block;
}

.result-title{
  color:#aeb7cc;
  font-size:14px;
  margin-bottom:10px;
}

.status-card{
  min-height:190px;
  padding:25px;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(135deg,#6547e8,#d53c8d);
  box-shadow:0 12px 30px rgba(0,0,0,.25);
}

#statusText{
  font-size:22px;
  font-weight:700;
  line-height:1.5;
  white-space:pre-line;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.action{
  border:0;
  border-radius:13px;
  padding:14px 8px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.copy{
  background:#fff;
  color:#111;
}

.share{
  background:#25D366;
  color:white;
}

.random{
  width:100%;
  margin-top:10px;
  border:1px solid #343e61;
  background:#171d31;
  color:white;
  padding:14px;
  border-radius:13px;
  font-size:15px;
  cursor:pointer;
}

.tip{
  margin:25px 0 10px;
  color:#8790a8;
  text-align:center;
  font-size:13px;
}
.photo-maker{
  margin-top:35px;
  padding-top:10px;
}

.maker-info{
  color:#aeb7cc;
  line-height:1.5;
}

.upload-btn{
  display:block;
  width:100%;
  margin-top:15px;
  padding:16px;
  text-align:center;
  border-radius:14px;
  background:#7654ff;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.photo-preview{
  display:none;
  position:relative;
  margin-top:18px;
  width:100%;
  aspect-ratio:4/5;
  overflow:hidden;
  border-radius:20px;
  background:#171d31;
}

.photo-preview.show{
  display:block;
}

#userPhoto{
  width:100%;
  height:100%;
  object-fit:cover;
}

#photoText{
  position:absolute;
  left:20px;
  right:20px;
  bottom:35px;
  padding:12px;
  color:white;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  line-height:1.4;
  text-shadow:
    0 2px 5px #000,
    0 0 10px #000;
}  
</style>
</head>

<body>

<div class="app">

  <div class="logo">StatusMint ✨</div>
  <div class="tagline">Create. Share. Express.</div>

  <div class="hero">
    <h1>Your next status is here.</h1>
    <p>Choose a mood and get a Hindi or Hinglish caption instantly.</p>
  </div>

  <h2>Choose a category</h2>

  <div class="categories">
    <button class="category" data-category="attitude">🔥 Attitude</button>
    <button class="category" data-category="love">❤️ Love</button>
    <button class="category" data-category="motivation">💪 Motivation</button>
    <button class="category" data-category="cool">😎 Cool</button>
    <button class="category" data-category="birthday">🎂 Birthday</button>
    <button class="category" data-category="shayari">🌙 Shayari</button>
  </div>

  <div id="result" class="result">

    <div class="result-title">YOUR STATUS</div>

    <div class="status-card">
      <div id="statusText"></div>
    </div>

    <div class="actions">
      <button class="action copy" onclick="copyStatus()">📋 Copy</button>
      <button class="action share" onclick="shareStatus()">↗ Share</button>
    </div>

    <button class="random" onclick="newStatus()">
      🔄 Show another
    </button>

  </div>
<div class="photo-maker">

  <h2>📸 Photo Status Maker</h2>

  <p class="maker-info">
    Apni photo choose karke stylish status banao.
  </p>

  <label class="upload-btn">
    🖼️ Choose Photo
    <input
      type="file"
      id="photoInput"
      accept="image/*"
      hidden
    >
  </label>

  <div id="photoPreview" class="photo-preview">
    <img id="userPhoto" alt="Your selected photo">
    <div id="photoText">Your status ✨</div>
  </div>

</div>
  <div class="tip">Made with StatusMint ✨</div>

</div>

  
<script>
const statuses = {

attitude: [
  "Hum badle nahi hain, bas samajh gaye hain ki duniya kaise chalti hai. 😎",
  "Apni vibe ka main khud brand hoon. 🔥",
  "Respect do, respect lo. Baaki ignore karo. 👑",
  "Mujhe judge karne se pehle apni story check kar lena. 😉",
  "Naam chhota ho sakta hai, pehchaan nahi. 🔥",
  "Silent rehna weakness nahi, meri choice hai. 😎"
],

love: [
  "Tum ho to har din thoda aur khoobsurat lagta hai. ❤️",
  "Dil ko sukoon tab milta hai jab baat tumse hoti hai. 💕",
  "Perfect koi nahi hota, par tum mere liye kaafi ho. ❤️",
  "Ek tum, ek main, aur thodi si endless baatein. 🫶",
  "Mohabbat lafzon se nahi, ehsaas se hoti hai. ❤️",
  "Meri favourite notification aaj bhi tum ho. 💌"
],

motivation: [
  "Slow progress bhi progress hoti hai. Keep going. 💪",
  "Sapna bada hai to mehnat bhi badi karni padegi. 🔥",
  "Aaj ka struggle kal ki strength banega. 💯",
  "Khud par bharosa rakho, waqt badalte der nahi lagti. 🚀",
  "Jeetne wale excuses nahi, raaste dhoondte hain. 💪",
  "Roz 1% better. Bas yahi game hai. 📈"
],

cool: [
  "Low-key life, high-key dreams. 😎",
  "No drama. Bas peace aur progress. ✌️",
  "Online hoon, available nahi. 😌",
  "Mood: apni duniya mein mast. 😎",
  "Simple dikhta hoon, boring nahi. ⚡",
  "Less talking, more living. 🖤"
],

birthday: [
  "Aaj ka din special hai—Happy Birthday! 🎂✨",
  "Cake khao, tension bhool jao. Happy Birthday! 🎉",
  "Tumhari smile hamesha aise hi rahe. Happy Birthday! ❤️🎂",
  "Ek aur saal, ek aur nayi kahani. Happy Birthday! 🥳",
  "May your year be full of happiness and success. 🎉",
  "Birthday vibes only! 🎂🥳✨"
],

shayari: [
  "Khamoshi bhi bahut kuch keh jaati hai,\nBas samajhne wala chahiye. 🌙",
  "Waqt badalta raha,\nAur hum sambhalte rahe. ✨",
  "Kuch yaadein lafzon ki mohtaaj nahi hoti,\nWoh bas dil mein reh jaati hain. ❤️",
  "Safar khoobsurat hai,\nManzil ki fikr kyun karein. 🌙",
  "Dil saaf rakho,\nHisaab waqt khud kar dega. ✨",
  "Har raat ke baad savera hai,\nBas hausla zinda rakhna. 🌅"
]

};

let currentCategory = "";
let previousIndex = -1;

document.querySelectorAll(".category").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".category").forEach(b => {
      b.classList.remove("active");
    });

    button.classList.add("active");

    currentCategory = button.dataset.category;
    previousIndex = -1;

    newStatus();

    document.getElementById("result").classList.add("show");

    setTimeout(() => {
      document.getElementById("result").scrollIntoView({
        behavior:"smooth",
        block:"start"
      });
    },100);

  });

});

function newStatus(){

  if(!currentCategory){
    return;
  }

  const list = statuses[currentCategory];

  let index = Math.floor(Math.random() * list.length);

  if(list.length > 1){
    while(index === previousIndex){
      index = Math.floor(Math.random() * list.length);
    }
  }

  previousIndex = index;

  document.getElementById("statusText").textContent = list[index];
}

async function copyStatus(){

  const text = document.getElementById("statusText").innerText;

  try{
    await navigator.clipboard.writeText(text);
    alert("Status copied! ✅");
  }
  catch(error){
    alert("Copy nahi hua. Text ko long-press karke copy karein.");
  }
}

async function shareStatus(){

  const text = document.getElementById("statusText").innerText;

  if(navigator.share){
    try{
      await navigator.share({
        title:"StatusMint",
        text:text
      });
    }
    catch(error){}
  }
  else{
    const url = "https://wa.me/?text=" +
      encodeURIComponent(text + "\n\nMade with StatusMint ✨");

    window.open(url,"_blank");
  }
}

  const photoInput = document.getElementById("photoInput");
const userPhoto = document.getElementById("userPhoto");
const photoPreview = document.getElementById("photoPreview");
const photoText = document.getElementById("photoText");

photoInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file){
    return;
  }

  const imageURL = URL.createObjectURL(file);

  userPhoto.src = imageURL;
  photoPreview.classList.add("show");

  const currentStatus =
    document.getElementById("statusText").innerText.trim();

  if(currentStatus){
    photoText.innerText = currentStatus;
  } else {
    photoText.innerText = "Your status ✨";
  }

});
</script>

</body>
</html>
